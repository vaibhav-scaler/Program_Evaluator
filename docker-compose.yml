version: '3.8'

services:
  program-evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    image: scaler-program-evaluator:latest
    container_name: scaler_evaluator_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./metabase_config.json:/app/metabase_config.json
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
